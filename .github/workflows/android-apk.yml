name: Build & Publish Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Test & Build English Pro APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Prepare signing keystore for debug APK
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore || rm -f debug.keystore
            fi
            if [ ! -f debug.keystore ]; then
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Installable Android APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Package APK with clean filename
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/English-Pro-V1.0.apk
          ls -lh release-apk/English-Pro-V1.0.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: English-Pro-V1.0-APK
          path: release-apk/English-Pro-V1.0.apk
          retention-days: 90

      - name: Build Signed Release APK (when signing secrets exist)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            gradle :app:assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk release-apk/English-Pro-V1.0-release.apk
          else
            echo "Release signing secrets not set; skipping release APK (debug APK is ready)."
          fi

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0' }}
          name: "English Pro V.1.0"
          body: |
            ## English Pro V.1.0 — فایل نصبی اندروید (APK)

            اپلیکیشن اختصاصی آموزش مکالمه انگلیسی و مهندسی عمران (آفلاین و آنلاین)
            تهیه‌کننده: **محمد عظیمی**

            ### نحوه دانلود و نصب روی گوشی اندروید / شیائومی:
            1. از بخش **Assets** پایین همین صفحه، فایل **`English-Pro-V1.0.apk`** را دانلود کنید.
            2. روی فایل دانلودشده بزنید و در صورت درخواست، اجازه نصب از منبع ناشناس (*Install unknown apps*) را فعال کنید.
          files: |
            release-apk/English-Pro-V1.0*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
